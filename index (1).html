<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Procurement ERP · PR to GR prototype</title>
<meta name="description" content="Clickable prototype: Purchase Request to Goods Receipt for a multi-branch ERP.">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F4F5F7;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#1A1D23}
a{color:#1F4FA3}a:hover{color:#163B7C}
.nav{display:flex;align-items:center;gap:10px;padding:0 10px;min-height:44px;border-radius:8px;color:#3A4150;font-size:14px;font-weight:500;background:none;border:0;width:100%;text-align:left;cursor:pointer;font-family:inherit;white-space:nowrap}
.nav:hover{background:#F1F3F7;color:#1A1D23}
.nav.on{background:#E6EDF9;color:#1F4FA3;font-weight:600}
.cnt{margin-left:auto;font-size:12px;font-weight:600;background:#ECEEF1;color:#3A4150;border-radius:999px;padding:2px 8px}
.cnt.hot{background:#FFF1D0;color:#7A4F00}
.card{background:#FFFFFF;border:1px solid #E1E4EA;border-radius:12px;min-width:0}
.mono{font-family:inherit;font-size:13px;font-variant-numeric:tabular-nums}
.hd{display:grid;align-items:center;gap:12px;padding:10px 16px;font-size:12px;font-weight:600;color:#5B6372;background:#FAFBFC;border-bottom:1px solid #E1E4EA}
.row{display:grid;align-items:start;gap:12px;padding:12px 16px;font-size:14px;border-bottom:1px solid #EEF0F3}
.r{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;border:1px solid #C9CED8;background:#FFFFFF;color:#1A1D23;text-decoration:none;box-sizing:border-box;white-space:nowrap}
.btn:hover{background:#F1F3F7}
.btn-p{background:#1F4FA3;border-color:#1F4FA3;color:#FFFFFF}
.btn-p .cnt{background:rgba(255,255,255,0.22);color:#FFFFFF}.btn-p:hover{background:#163B7C;color:#FFFFFF}
.btn-g{background:#1B6136;border-color:#1B6136;color:#FFFFFF}.btn-g:hover{background:#144A29}
.btn-d{color:#9B2316;border-color:#E0A8A1}.btn-d:hover{background:#FBE1DE}
.btn-dd{background:#9B2316;border-color:#9B2316;color:#FFFFFF}.btn-dd:hover{background:#7E1C11}
.btn-sm{min-height:36px;padding:0 14px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;font-family:inherit;font-size:inherit;font-weight:600;color:#1F4FA3;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.crumb{background:none;border:0;padding:0;font-family:inherit;font-size:13px;color:#1F4FA3;cursor:pointer}
.crumb:hover{text-decoration:underline}
.doc{background:none;border:0;padding:0;font-family:inherit;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:#1F4FA3;cursor:pointer;text-align:left}
.doc:hover{text-decoration:underline}
.in{font-family:inherit;font-size:14px;padding:0 10px;min-height:44px;border:1px solid #C9CED8;border-radius:8px;background:#FFFFFF;color:#1A1D23;box-sizing:border-box;width:100%}
textarea.in{padding:10px;min-height:96px;resize:vertical;line-height:1.45}
.in:focus{outline:2px solid #1F4FA3;outline-offset:1px}
.in[readonly]{background:#F4F5F7;color:#3A4150}
.in:disabled{background:#F4F5F7;color:#3A4150;border-color:#E1E4EA !important;cursor:not-allowed}
.num{text-align:right}
.lb{display:block;font-size:12px;font-weight:600;color:#3A4150;margin-bottom:6px}
.k{display:block;font-size:12px;font-weight:600;color:#5B6372;margin-bottom:4px}
.req{color:#9B2316}
.err{font-size:12px;color:#9B2316;font-weight:500;margin-top:6px}
.sub{font-size:12px;color:#5B6372;margin-top:4px}
.h2{margin:0;font-size:16px;font-weight:600}
.tab{background:none;border:none;border-bottom:2px solid transparent;font-family:inherit;font-size:14px;font-weight:600;color:#5B6372;padding:0 4px;min-height:44px;cursor:pointer;white-space:nowrap}
.tab:hover{color:#1A1D23}
.tab.on{color:#1F4FA3;border-bottom-color:#1F4FA3}
.ck{width:18px;height:18px;margin:2px 0 0;accent-color:#1F4FA3;cursor:pointer}
.ck:disabled{cursor:not-allowed}
.hint{font-size:13px;color:#3A4150;background:#FFFFFF;border:1px solid #E1E4EA;border-radius:12px;padding:14px 16px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px 16px;border-radius:10px;border:1px solid #C9CED8;background:#FFFFFF;font-family:inherit;cursor:pointer;color:#1A1D23}
.opt:hover{border-color:#1F4FA3;background:#F2F6FD}
.li{padding:12px 20px;border-top:1px solid #EEF0F3;display:flex;flex-direction:column;gap:4px;font-size:13px;color:#3A4150}
.lr{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px;color:#1A1D23}
.fcn{cursor:pointer;font-family:inherit;color:inherit}
.fcn:hover{border-color:#1F4FA3 !important;box-shadow:0 0 0 3px #DCE7FA}
.ph{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.02em}
.ph::after{content:"";flex:1;height:1px;background:currentColor;opacity:.25}
.stg{position:relative;display:flex;flex-direction:column;gap:12px;padding:18px;background:#FFFFFF;border:1px solid #E1E4EA;border-radius:14px;box-shadow:0 1px 2px rgba(20,33,61,.04)}
.stg h3{margin:0;font-size:15px;font-weight:600}
.sic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
.sno{margin-left:auto;font-size:12px;font-weight:700;color:#8A93A3;font-variant-numeric:tabular-nums}
.av{width:24px;height:24px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;border:2px solid #FFFFFF;margin-left:-6px}
.av:first-child{margin-left:0}
.big{display:flex;align-items:baseline;gap:8px;padding:10px 12px;border-radius:10px;background:#F6F7F9}
.big b{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.big > span:last-child{font-size:12px;color:#5B6372}
.rl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;font-size:12.5px;color:#3A4150;line-height:1.4;flex:1}
.rl li{display:flex;gap:7px}
.rl li::before{content:"";flex:none;width:5px;height:5px;margin-top:6px;border-radius:999px;background:#9AA3B2}
.exc{display:flex;flex-direction:column;gap:10px;padding:16px 18px;background:#FFFFFF;border:1px solid #E1E4EA;border-radius:12px}
.pth{display:flex;flex-wrap:nowrap;white-space:nowrap;align-items:center;gap:6px;font-size:12px;font-weight:600}
.pth span{padding:3px 8px;border-radius:6px}
.kpi{display:flex;flex-direction:column;gap:6px;padding:18px 20px;text-align:left;cursor:pointer;background:#FFFFFF;border:1px solid #E1E4EA;border-radius:12px;font-family:inherit;color:#1A1D23}
.kpi:hover{border-color:#1F4FA3}
.cbi{flex:1;min-width:0;border:0;outline:none;background:transparent;font-family:inherit;font-size:14px;color:#1A1D23;padding:0 10px;height:42px}
.cbi::selection{background:#BFD4F6}
.cbx{flex:none;width:20px;height:20px;border-radius:999px;border:0;background:#A5ACB8;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.cbx:hover{background:#7E8696}
.cbc{flex:none;width:32px;height:32px;border:0;background:none;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;border-radius:6px}
.cbc:hover{background:#F1F3F7}
.cbo{display:block;width:100%;text-align:left;padding:11px 16px;border:0;background:#FFFFFF;font-family:inherit;font-size:14px;color:#1A1D23;cursor:pointer}
.cbo:hover{background:#F2F6FD}
.cbo.sel{background:#E6EDF9;color:#1F4FA3;font-weight:600}
.cbm{display:block;width:100%;text-align:left;padding:12px 16px;border:0;border-top:1px solid #E1E4EA;background:#FFFFFF;font-family:inherit;font-size:14px;font-weight:600;color:#1F4FA3;cursor:pointer}
.cbm:hover{background:#F2F6FD}
.ib{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:0;border-radius:8px;background:none;color:#1A1D23;cursor:pointer}
.ib:hover{background:#E9ECF1}
.ib:disabled{color:#B4BAC4;cursor:not-allowed;background:none}
.row.stk{padding:6px 16px}
.row.tight{align-items:center;padding:7px 16px}
.row.tight .in{min-height:32px;height:32px}
.row.tight .cbw{min-height:32px !important}
.row.tight .cbi{height:30px !important}
.row.stk .in{min-height:36px}
.row.stk .btn-sm{min-height:32px}
.stk > :first-child{position:sticky;left:0;z-index:2;align-self:stretch;margin:-6px 0 -6px -16px;padding:6px 12px 6px 16px;background:#FFFFFF;box-shadow:1px 0 0 #E1E4EA}
.hd.stk > :first-child{margin:-10px 0 -10px -16px;padding:10px 12px 10px 16px;background:#FAFBFC;display:flex;align-items:center}
.tot.stk > :first-child{background:#FAFBFC}
.snav{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 10px 0 18px;border:0;border-radius:8px;background:none;color:#3A4150;font-family:inherit;font-size:14px;font-weight:500;text-align:left;cursor:pointer;white-space:nowrap;width:100%}
.snav:hover{background:#F1F3F7;color:#1A1D23}
.snav.on{background:linear-gradient(90deg,#3563B0,#24498F);color:#FFFFFF;font-weight:600}
.snav.on .cnt{background:rgba(255,255,255,0.22);color:#FFFFFF}
.facet{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 4px 0 10px;border-radius:6px;background:#E6EDF9;color:#1F4FA3;font-size:13px;font-weight:500;white-space:nowrap}
.fk{font-weight:600}
.fk:empty{display:none}
.fx{display:flex;align-items:center;justify-content:center;width:20px;height:20px;border:0;border-radius:999px;background:transparent;color:#1F4FA3;cursor:pointer;padding:0}
.fx:hover{background:#C9D9F5}
.fbtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;margin-left:auto;border:0;border-left:1px solid #E1E4EA;border-radius:0 6px 6px 0;background:none;font-family:inherit;font-size:13px;font-weight:600;color:#3A4150;cursor:pointer}
.fbtn:hover{background:#F1F3F7}
.fbadge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#1F4FA3;color:#FFFFFF;font-size:11px;font-weight:700;box-sizing:border-box}
.fopt{display:flex;align-items:center;gap:10px;padding:7px 6px;margin:0 -6px;border-radius:6px;font-size:14px;cursor:pointer}
.fopt:hover{background:#F2F6FD}
.fn{font-size:12px;color:#5B6372;font-variant-numeric:tabular-nums}
button,input,select,textarea{font-family:inherit}
h1,h2,h3{font-family:inherit}
.money{display:flex;align-items:center;height:36px;border:1px solid #C9CED8;border-radius:8px;background:#FFFFFF;padding-left:10px;box-sizing:border-box}
.money span{font-size:13px;color:#5B6372;flex:none}
.money input{flex:1;min-width:0;height:34px;border:0;outline:none;background:transparent;font-family:inherit;font-size:14px;color:#1A1D23;text-align:right;padding:0 10px;font-variant-numeric:tabular-nums}
.money input::placeholder{color:#5B6372}
.money:focus-within{border-color:#1F4FA3;box-shadow:0 0 0 3px #DCE7FA}
</style>

</head>
<body>
<div id="app"></div>
<template id="app-template">

<div style="display: flex; flex-wrap: wrap; min-height: 100vh; align-items: stretch">

<nav aria-label="Main navigation" style="flex: 1 1 232px; background: #FFFFFF; border-right: 1px solid #E1E4EA; padding: 20px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 10px 18px">
<div aria-hidden="true" style="width: 32px; height: 32px; border-radius: 8px; background: #1F4FA3; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px">P</div>
<div><div style="font-weight: 600; font-size: 15px">Procurement</div><div style="font-size: 12px; color: #5B6372">ERP · Multi-branch</div></div>
</div>
<button type="button" class="nav {{nav.flow}}" onClick="{{goFlow}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="6" height="5" rx="1.2"></rect><rect x="15" y="4" width="6" height="5" rx="1.2"></rect><rect x="9" y="15" width="6" height="5" rx="1.2"></rect><path d="M9 6.5h6M18 9v2.5a1.5 1.5 0 0 1-1.5 1.5H12v2"></path></svg>Procurement flow</button>
<button type="button" class="nav {{nav.dash}}" onClick="{{goDash}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>Dashboard</button>
<button type="button" class="nav" aria-expanded="{{nav.grpOpenS}}" onClick="{{toggleGrp}}" style="font-weight: {{nav.grpFw}}; color: {{nav.grpFg}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6M8 13h8M8 17h5"></path></svg>Purchase Request<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-left: auto; transform: rotate({{nav.grpRot}}deg)"><path d="m6 9 6 6 6-6"></path></svg></button>
<sc-if value="{{nav.grpOpen}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; padding-left: 16px; margin: 2px 0 4px">
<div aria-hidden="true" style="flex: none; width: 4px; border-radius: 2px; background: #E1E4EA; display: flex; flex-direction: column; overflow: hidden"><span style="flex: 1; background: {{nav.rail1}}"></span><span style="flex: 1; background: {{nav.rail2}}"></span></div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding-left: 6px">
<button type="button" class="snav {{nav.req}}" onClick="{{goReq}}">Purchase Request<span class="cnt">{{nav.reqN}}</span></button>
<button type="button" class="snav {{nav.lines}}" onClick="{{goLines}}">Purchase Request Line<span class="cnt">{{nav.linesN}}</span></button>
</div>
</div>
</sc-if>
<button type="button" class="nav {{nav.pos}}" onClick="{{goPos}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle><path d="M3 4h2l2.4 11h11.2L21 8H6.2"></path></svg>Purchase orders<span class="cnt">{{nav.posN}}</span></button>
<button type="button" class="nav {{nav.grs}}" onClick="{{goGrs}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"></path><path d="M3 8l9 5 9-5M12 13v8"></path></svg>Goods receipts<span class="cnt">{{nav.grsN}}</span></button>
<button type="button" class="nav" aria-expanded="{{nav.cfgOpenS}}" onClick="{{toggleCfg}}" style="font-weight: {{nav.cfgFw}}; color: {{nav.cfgFg}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>Configuration<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-left: auto; transform: rotate({{nav.cfgRot}}deg)"><path d="m6 9 6 6 6-6"></path></svg></button>
<sc-if value="{{nav.cfgOpen}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; padding-left: 16px; margin: 2px 0 4px">
<div aria-hidden="true" style="flex: none; width: 4px; border-radius: 2px; background: {{nav.cfgRail}}"></div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding-left: 6px">
<button type="button" class="snav" aria-expanded="{{nav.amOpenS}}" onClick="{{toggleAm}}" style="font-weight: {{nav.cfgFw}}">Approval Matrix<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-left: auto; transform: rotate({{nav.amRot}}deg)"><path d="m6 9 6 6 6-6"></path></svg></button>
<sc-if value="{{nav.amOpen}}" hint-placeholder-val="{{ true }}"><div style="padding-left: 14px; display: flex; flex-direction: column; gap: 2px"><button type="button" class="snav {{nav.mx}}" onClick="{{goMx}}"><span aria-hidden="true" style="width: 5px; height: 5px; border-radius: 999px; background: currentColor; opacity: 0.6"></span>Purchase Request</button></div></sc-if>
</div>
</div>
</sc-if>
<div style="margin-top: auto; padding: 14px 10px 0; border-top: 1px solid #EEF0F3; display: flex; flex-direction: column; gap: 6px">
<label for="cb-me" style="font-size: 12px; color: #5B6372">Viewing as</label>
<div class="cbw" style="position: relative; z-index: {{meCb.z}}; display: flex; align-items: center; gap: 4px; min-height: 44px; padding-right: 4px; border: 1px solid {{meCb.bd}}; border-radius: 8px; background: #FFFFFF; box-shadow: {{meCb.ring}}; box-sizing: border-box">
<input id="{{meCb.id}}" class="cbi" style="height: 42px" role="combobox" aria-label="Viewing as" aria-autocomplete="list" aria-expanded="{{meCb.openS}}" autocomplete="off" placeholder="Search user" value="{{meCb.text}}" onFocus="{{meCb.focus}}" onChange="{{meCb.input}}" onKeyDown="{{meCb.key}}">
<sc-if value="{{meCb.hasVal}}" hint-placeholder-val="{{ true }}"><button type="button" class="cbx" aria-label="Clear search" onClick="{{meCb.clear}}"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></sc-if>
<button type="button" class="cbc" aria-label="Show options" onClick="{{meCb.toggle}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1D23" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{meCb.rot}}deg)"><path d="m6 9 6 6 6-6"></path></svg></button>
</div>
<sc-if value="{{meCb.open}}" hint-placeholder-val="{{ false }}">
<div aria-hidden="true" onClick="{{cbClose}}" style="position: fixed; inset: 0; z-index: 40"></div>
<div style="position: fixed; left: {{meCb.dl}}; top: {{meCb.dt}}; bottom: {{meCb.db}}; width: {{meCb.dw}}; z-index: 41; background: #FFFFFF; border: 1px solid #D5DAE3; border-radius: 10px; box-shadow: 0 12px 28px rgba(20, 33, 61, 0.14); overflow: hidden; text-align: left">
<div role="listbox" aria-label="Viewing as" style="max-height: 232px; overflow-y: auto; padding: 6px 0">
<sc-for list="{{meCb.opts}}" as="op" hint-placeholder-count="4"><button type="button" role="option" class="cbo {{op.cls}}" aria-selected="{{op.selS}}" onClick="{{op.pick}}">{{op.label}}</button></sc-for>
<sc-if value="{{meCb.empty}}" hint-placeholder-val="{{ false }}"><div style="padding: 10px 16px; font-size: 13px; color: #5B6372">No matches for “{{meCb.q}}”</div></sc-if>
</div>
<button type="button" class="cbm" onClick="{{meCb.more}}">Search more</button>
</div>
</sc-if>
<div style="font-size: 12px; color: #5B6372">{{meRole}}</div>
<sc-if value="{{resetAsk}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; font-size: 12px; color: #5B6372">Restore the sample data?
<button type="button" class="btn btn-sm btn-d" onClick="{{resetYes}}">Reset</button>
<button type="button" class="btn btn-sm" onClick="{{resetNo}}">Cancel</button>
</div>
</sc-if>
<sc-if value="{{resetIdle}}" hint-placeholder-val="{{ true }}">
<div style="margin-top: 6px"><button type="button" class="link" style="font-size: 12px; font-weight: 500" onClick="{{resetStart}}">Reset demo data</button></div>
</sc-if>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; padding: 28px clamp(16px, 3vw, 36px) 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">

<sc-if value="{{is.flow}}" hint-placeholder-val="{{ false }}">

<sc-for list="{{req.fb.facets}}" as="fc" hint-placeholder-count="1"><span class="facet"><span class="fk">{{fc.k}}</span><span>{{fc.v}}</span><button type="button" class="fx" aria-label="Remove filter {{fc.v}}" onClick="{{fc.rm}}"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></span></sc-for>

<button type="button" class="fbtn" aria-haspopup="dialog" aria-expanded="{{req.fb.openS}}" onClick="{{req.fb.toggle}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4-2v-4z"></path></svg>Filters<sc-if value="{{req.fb.hasActive}}" hint-placeholder-val="{{ false }}"><span class="fbadge">{{req.fb.activeN}}</span></sc-if><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{req.fb.rot}}deg)"><path d="m6 9 6 6 6-6"></path></svg></button>
</div>
<sc-if value="{{req.fb.open}}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-label="Filters" style="position: absolute; right: 0; top: calc(100% + 6px); z-index: 31; width: min(760px, 100%); background: #FFFFFF; border: 1px solid #D5DAE3; border-radius: 12px; box-shadow: 0 16px 36px rgba(20, 33, 61, 0.16); overflow: hidden">

</div>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 16px; background: #FAFBFC"><button type="button" class="link" style="font-size: 13px" onClick="{{req.fb.clear}}">Clear all filters</button><span style="font-size: 13px; color: #5B6372">{{req.fb.resultTxt}}</span><button type="button" class="btn btn-sm btn-p" onClick="{{menuClose}}">Done</button></div>
</div>

</div>
<section class="card" style="overflow: hidden">

<div style="position: fixed; inset: 0; z-index: 35; display: flex; align-items: center; justify-content: center; padding: 16px; pointer-events: none">

<div style="border-left: 1px solid #E1E4EA">

<button type="button" class="cbc" aria-label="Show options" onClick="{{g.cbV.toggle}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1D23" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{g.cbV.rot}}deg)"><path d="m6 9 6 6 6-6"></path></svg></button>
</div>
<sc-if value="{{g.cbV.open}}" hint-placeholder-val="{{ false }}">

</div>

</div>
</div>
</sc-for>
</div>
</div>
<div style="display: flex; justify-content: flex-end; gap: 10px; padding: 14px 24px 20px; border-top: 1px solid #EEF0F3">
<button type="button" class="btn" onClick="{{req.dlg.cancel}}">Cancel</button>
<button type="button" class="btn btn-p" onClick="{{req.dlg.go}}">{{req.dlg.btn}}</button>

</section>
</div>

<sc-if value="{{req.showLines}}" hint-placeholder-val="{{ true }}"><p style="margin: 0; padding: 12px 20px; font-size: 13px; color: #5B6372">Only lines of fully approved requests can be selected. Lines from different requests and departments can share one PO when they go to the same warehouse; each PO line keeps its PR reference.</p></sc-if>
</section>
